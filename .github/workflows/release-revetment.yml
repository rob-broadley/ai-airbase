name: Release revetment

on:
  push:
    tags:
      - 'revetment/v*'
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: release-revetment
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Shallow checkout (for git credentials)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Resolve ref
        id: resolve_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_INPUT: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            build_ref=$(git ls-remote --tags --sort=-creatordate origin 'refs/tags/revetment/v*' | grep -v '\^{}' | head -1 | awk '{print $2}')
            if [ -z "$build_ref" ]; then
              echo "No revetment/v* tags found, aborting" && exit 1
            fi
          else
            build_ref="$GITHUB_REF_INPUT"
          fi
          echo "build_ref=${build_ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout resolved ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.resolve_ref.outputs.build_ref }}

      - name: Read Copilot version
        id: copilot
        run: |
          COPILOT_VERSION=$(sed -n '1p' .copilot-version)
          COPILOT_INTEGRITY=$(sed -n '2p' .copilot-version)
          echo "copilot_version=${COPILOT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "copilot_integrity=${COPILOT_INTEGRITY}" >> "$GITHUB_OUTPUT"

      - name: Derive VERSION
        id: version
        env:
          BUILD_REF: ${{ steps.resolve_ref.outputs.build_ref }}
        run: |
          tag="${BUILD_REF#refs/tags/}"
          version="${tag#revetment/}"
          if [ -z "$version" ]; then
            echo "Could not derive version from ref: $BUILD_REF" && exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Derive REVISION
        id: revision
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build and push image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: revetment/Containerfile
          push: true
          tags: ghcr.io/rob-broadley/ai-airbase/revetment:latest
          build-args: |
            COPILOT_VERSION=${{ steps.copilot.outputs.copilot_version }}
            COPILOT_INTEGRITY=${{ steps.copilot.outputs.copilot_integrity }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.revision }}
