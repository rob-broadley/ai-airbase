name: Release marshal

on:
  push:
    tags:
      - 'marshal/v*'

concurrency:
  group: release-marshal-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: marshal/go.mod
          cache: true
          cache-dependency-path: marshal/go.sum

      - name: Vet
        working-directory: marshal
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.12.2
          working-directory: marshal

      - name: Test
        working-directory: marshal
        run: go test -race ./...

  build-and-release:
    name: Build and release
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: marshal/go.mod
          cache: true
          cache-dependency-path: marshal/go.sum

      - name: Derive clean version
        id: version
        run: echo "version=${GITHUB_REF_NAME#marshal/}" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: marshal
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          MARSHAL_VERSION: ${{ steps.version.outputs.version }}
        run: go build -ldflags "-X main.version=$MARSHAL_VERSION" -o marshal-linux-amd64 ./cmd

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          name: ${{ steps.version.outputs.version }}
          files: marshal/marshal-linux-amd64
